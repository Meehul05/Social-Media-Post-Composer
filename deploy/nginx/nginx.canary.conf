worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream backend_stable {
        server backend-stable:8080 max_fails=3 fail_timeout=10s;
    }

    upstream backend_canary {
        server backend-canary:8080 max_fails=2 fail_timeout=10s;
    }

    # Weighted Canary Traffic Split: 90% Stable, 10% Canary
    split_clients "${remote_addr}${http_user_agent}${msec}" $canary_upstream {
        90%     backend_stable;
        10%     backend_canary;
    }

    # Allow explicit header override X-Canary-Track: canary|stable for QA testing
    map $http_x_canary_track $target_upstream {
        "canary" backend_canary;
        "stable" backend_stable;
        default  $canary_upstream;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://$target_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-Id $request_id;

            # Automatic failover to stable if canary returns 5xx
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            add_header X-Routed-Upstream $target_upstream always;
        }
    }
}
